<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购计划预览 - {{ plan.plan_name }}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: "SimSun", "Songti SC", sans-serif; }
        /* 操作按钮栏（不打印） */
        .action-bar {
            position: sticky; top: 0; z-index: 100;
            background: #fff; border-bottom: 1px solid #e0e0e0;
            padding: 12px 20px; text-align: center;
            box-shadow: 0 2px 4px rgba(0,0,0,.06);
        }
        .action-bar .btn {
            display: inline-block; padding: 8px 20px; margin: 0 6px;
            font-size: 14px; text-decoration: none; border-radius: 6px;
            cursor: pointer; font-weight: 500; transition: all .2s;
        }
        .btn-pdf { background: #1e4e79; color: #fff; border: none; }
        .btn-pdf:hover { background: #163a5e; transform: translateY(-1px); }
        .btn-print { background: #6c757d; color: #fff; border: none; }
        .btn-print:hover { background: #5a6268; }
        .btn-back { background: #fff; color: #1e4e79; border: 1px solid #1e4e79; }
        .btn-back:hover { background: #1e4e79; color: #fff; }
        /* 预览容器：A4 白纸效果 */
        .preview-wrapper {
            max-width: 210mm; margin: 20px auto; background: #fff;
            box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 15mm;
        }
        @media print {
            body { background: #fff; }
            .action-bar { display: none !important; }
            .preview-wrapper { box-shadow: none; margin: 0; padding: 0; max-width: none; }
            @page { margin: 15mm; size: A4; }
        }
    </style>
</head>
<body>
    <div class="action-bar no-print">
        <a href="{{ url_for('plan.export_pdf', id=plan.id) }}" class="btn btn-pdf">
            <i class="bi bi-file-earmark-pdf"></i> 导出 PDF
        </a>
        <a href="javascript:window.print()" class="btn btn-print">
            <i class="bi bi-printer"></i> 打印
        </a>
        <a href="{{ url_for('plan.detail', id=plan.id) }}" class="btn btn-back">
            <i class="bi bi-arrow-left"></i> 返回详情
        </a>
        <a href="{{ url_for('plan.index') }}" class="btn btn-back">
            <i class="bi bi-list"></i> 返回列表
        </a>
    </div>

    <div class="preview-wrapper">
        {% include 'plan/plan_pdf.html' %}
    </div>
</body>
</html>
