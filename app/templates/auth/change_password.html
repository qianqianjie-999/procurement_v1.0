{% extends "base.html" %}

{% block title %}修改密码 - 采购管理系统{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header text-center py-4 bg-gradient-primary">
                    <i class="bi bi-key-fill text-white" style="font-size: 2rem;"></i>
                    <h4 class="text-white mb-0 mt-2">修改登录密码</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.change_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i>原密码
                            </label>
                            <input type="password" class="form-control form-control-lg" name="old_password" required placeholder="请输入当前密码">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-shield-lock me-1"></i>新密码
                            </label>
                            <input type="password" class="form-control form-control-lg" name="new_password" required minlength="6" placeholder="至少 6 位">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-shield-check me-1"></i>确认新密码
                            </label>
                            <input type="password" class="form-control form-control-lg" name="confirm_password" required minlength="6" placeholder="再次输入新密码">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg py-2 fw-bold">
                                <i class="bi bi-check-lg me-1"></i>确认修改
                            </button>
                            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.bg-gradient-primary {
    background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
}
</style>
{% endblock %}
